name: Keep Supabase Alive

on:
  schedule:
    # Roda a cada 3 dias à meia-noite (UTC)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch data from Supabase to reset activity timer
        run: >
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/ping?select=id&limit=1"
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
